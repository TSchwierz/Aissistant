# Copy to config.toml and edit for your Pi.

# Optional overlay for Studio Climate inside Personal AIssistent.
# Copy to config.climate.toml next to the repo root. Listen host/port come from PA_*.
# Every HTTP route uses PA_API_KEY. There is no climate-only token.

[database]
# Resolved under PA_DATA_DIR (default ./data) → data/climate.db
path = "climate.db"

[collector]
sample_interval_seconds = 60
gpio_pin = 23
# Default true in the unified server for PC smoke tests; set false on the Pi with DHT11.
mock_sensor = true

[ntfy]
# Leave topic empty to disable notifications until configured.
server = "https://ntfy.sh"
topic = ""
# Optional: ntfy access token if the topic is protected
token = ""

[quiet_hours]
# Suppress ntfy notifications during these hours (e.g. sleeping hours).
# Readings are still collected; a still-active breach alerts once the window ends.
enabled = true
# Local wall-clock "HH:MM"; the window may wrap past midnight.
start = "23:00"
end = "08:00"
# IANA zone, e.g. "Europe/Berlin". Empty = the Pi's own local time.
timezone = ""

[weather]
# Outside temperature/humidity averaged over Open-Meteo, OpenWeatherMap and
# Bright Sky (DWD). Needs internet access; set false for a fully offline Pi.
enabled = true
# Where the studio is — default is Düsseldorf.
latitude = 51.2277
longitude = 6.7735
# How often to pull outside conditions + forecast. Roughly 5 requests per poll,
# well inside every free tier.
poll_interval_minutes = 60
# On an alert, reuse the stored reading if it is younger than this; else refetch.
alert_max_age_minutes = 30
# Hours of hourly forecast to store, capped at 24. The dashboard still shows
# the next 4 hours; the Forecast tab reads this horizon. Missing hours stay gaps.
forecast_hours = 24
request_timeout_seconds = 10
# Optional. Open-Meteo and Bright Sky need no key; leave empty to average over
# those two only. Get one at openweathermap.org to use all three.
openweathermap_api_key = ""

[defaults]
humidity_min = 40
humidity_max = 55
temp_min = 18
temp_max = 24
sustain_minutes = 30
# Minutes between repeat out-of-band alerts for the same condition (6 hours).
alert_cooldown_minutes = 360
# Rolling average of this many indoor samples; used to spot sudden climate shifts.
rolling_window_points = 8
# Fire a change incident when the current window differs from the previous by this much.
incident_humidity_delta = 6
incident_temp_delta = 1.5
# Minutes between repeat change-warning notifications.
incident_cooldown_minutes = 20

# Live notes + weekly JSON under PA_DATA_DIR/advisor (gitignored reports/).
[advisor]
path = "advisor"
